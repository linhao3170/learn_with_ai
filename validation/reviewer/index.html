<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事实审核工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .fact-row { transition: background-color 0.15s ease; }
    .fact-row:hover { background-color: #f8fafc; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 12px; font-weight: 500; }
    .badge-verified { background-color: #dcfce7; color: #166534; }
    .badge-inferred { background-color: #fef3c7; color: #92400e; }
    .status-ok { background-color: #dcfce7; color: #166534; }
    .status-error { background-color: #fee2e2; color: #991b1b; }
    .status-pending { background-color: #f1f5f9; color: #475569; }
    .filter-btn { transition: all 0.15s ease; }
    .filter-btn.active { background-color: #3b82f6; color: white; }
    .sidebar-item { cursor: pointer; transition: background-color 0.15s ease; }
    .sidebar-item:hover { background-color: #f1f5f9; }
    .sidebar-item.active { background-color: #eff6ff; border-left: 3px solid #3b82f6; }
    .progress-bar { height: 6px; background-color: #e2e8f0; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width 0.3s ease; }
    textarea { resize: vertical; }
    .sticky-header th { position: sticky; top: 0; z-index: 10; background-color: #f8fafc; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <!-- 顶部导航 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-full mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-clipboard-check text-blue-600 text-xl"></i>
        <h1 class="text-lg font-semibold text-slate-800">事实审核工作台</h1>
        <span class="text-sm text-slate-400">|</span>
        <span id="projectName" class="text-sm text-slate-500">未加载项目</span>
      </div>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-md cursor-pointer hover:bg-blue-700 transition-colors text-sm">
          <i class="fa-solid fa-file-import"></i>
          <span>导入事实表 CSV</span>
          <input type="file" id="fileInput" accept=".csv" class="hidden">
        </label>
        <button id="exportBtn" class="flex items-center gap-2 px-4 py-2 bg-slate-700 text-white rounded-md hover:bg-slate-800 transition-colors text-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
          <i class="fa-solid fa-file-export"></i>
          <span>导出审核结果</span>
        </button>
        <button id="reportBtn" class="flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 transition-colors text-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
          <i class="fa-solid fa-chart-pie"></i>
          <span>生成报告</span>
        </button>
      </div>
    </div>
  </header>

  <div class="flex h-[calc(100vh-57px)]">
    <!-- 左侧边栏：统计 + 分类过滤 -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col overflow-y-auto">
      <!-- 进度统计 -->
      <div class="p-4 border-b border-slate-200">
        <h3 class="text-sm font-semibold text-slate-700 mb-3">审核进度</h3>
        <div class="progress-bar mb-2">
          <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-slate-500">已审核</span>
          <span id="progressText" class="font-medium text-slate-700">0 / 0</span>
        </div>
      </div>

      <!-- 快速统计 -->
      <div class="p-4 border-b border-slate-200">
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="p-2 bg-slate-50 rounded">
            <div id="totalCount" class="text-xl font-bold text-slate-700">0</div>
            <div class="text-xs text-slate-500">总计</div>
          </div>
          <div class="p-2 bg-green-50 rounded">
            <div id="okCount" class="text-xl font-bold text-green-600">0</div>
            <div class="text-xs text-green-600">正确</div>
          </div>
          <div class="p-2 bg-red-50 rounded">
            <div id="errorCount" class="text-xl font-bold text-red-600">0</div>
            <div class="text-xs text-red-600">错误</div>
          </div>
        </div>
      </div>

      <!-- 可信度过滤 -->
      <div class="p-4 border-b border-slate-200">
        <h3 class="text-sm font-semibold text-slate-700 mb-3">可信度筛选</h3>
        <div class="flex flex-col gap-2">
          <button data-filter="all" class="filter-btn active w-full text-left px-3 py-1.5 rounded text-sm bg-slate-100">
            <i class="fa-solid fa-layer-group mr-2 text-slate-500"></i>全部
          </button>
          <button data-filter="verified" class="filter-btn w-full text-left px-3 py-1.5 rounded text-sm hover:bg-green-50">
            <i class="fa-solid fa-circle-check mr-2 text-green-500"></i>verified（确定性）
          </button>
          <button data-filter="inferred" class="filter-btn w-full text-left px-3 py-1.5 rounded text-sm hover:bg-amber-50">
            <i class="fa-solid fa-triangle-exclamation mr-2 text-amber-500"></i>inferred（推断）
          </button>
        </div>
      </div>

      <!-- 状态过滤 -->
      <div class="p-4 border-b border-slate-200">
        <h3 class="text-sm font-semibold text-slate-700 mb-3">审核状态筛选</h3>
        <div class="flex flex-col gap-2">
          <button data-status="all" class="status-btn active w-full text-left px-3 py-1.5 rounded text-sm bg-slate-100">
            <i class="fa-solid fa-list mr-2 text-slate-500"></i>全部
          </button>
          <button data-status="pending" class="status-btn w-full text-left px-3 py-1.5 rounded text-sm hover:bg-slate-50">
            <i class="fa-regular fa-circle mr-2 text-slate-400"></i>待审核
          </button>
          <button data-status="ok" class="status-btn w-full text-left px-3 py-1.5 rounded text-sm hover:bg-green-50">
            <i class="fa-solid fa-circle-check mr-2 text-green-500"></i>已确认
          </button>
          <button data-status="error" class="status-btn w-full text-left px-3 py-1.5 rounded text-sm hover:bg-red-50">
            <i class="fa-solid fa-circle-xmark mr-2 text-red-500"></i>有错误
          </button>
        </div>
      </div>

      <!-- 类别导航 -->
      <div class="p-4 flex-1">
        <h3 class="text-sm font-semibold text-slate-700 mb-3">按类别浏览</h3>
        <div id="categoryList" class="flex flex-col gap-0.5">
          <p class="text-sm text-slate-400 italic">导入数据后显示</p>
        </div>
      </div>
    </aside>

    <!-- 主内容区：事实列表 -->
    <main class="flex-1 overflow-auto">
      <div class="p-6">
        <!-- 空状态 -->
        <div id="emptyState" class="flex flex-col items-center justify-center py-20 text-slate-400">
          <i class="fa-solid fa-table-cells-large text-5xl mb-4 text-slate-300"></i>
          <p class="text-lg mb-2">还没有导入事实表</p>
          <p class="text-sm">点击右上角"导入事实表 CSV"按钮开始审核</p>
        </div>

        <!-- 事实表格 -->
        <div id="tableContainer" class="hidden">
          <div class="bg-white rounded-lg border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto max-h-[calc(100vh-120px)]">
              <table class="w-full text-sm">
                <thead class="sticky-header">
                  <tr class="border-b border-slate-200 text-slate-600">
                    <th class="px-3 py-2 text-left font-medium w-16">ID</th>
                    <th class="px-3 py-2 text-left font-medium w-24">类别</th>
                    <th class="px-3 py-2 text-left font-medium w-28">类型</th>
                    <th class="px-3 py-2 text-left font-medium">描述</th>
                    <th class="px-3 py-2 text-left font-medium w-40">位置</th>
                    <th class="px-3 py-2 text-left font-medium w-24">可信度</th>
                    <th class="px-3 py-2 text-left font-medium w-44">证据</th>
                    <th class="px-3 py-2 text-center font-medium w-24">状态</th>
                    <th class="px-3 py-2 text-center font-medium w-28">操作</th>
                  </tr>
                </thead>
                <tbody id="factTableBody">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 右侧：详情/编辑面板 -->
    <aside id="detailPanel" class="w-96 bg-white border-l border-slate-200 flex flex-col overflow-y-auto hidden">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-semibold text-slate-700">审核详情</h3>
        <button id="closePanel" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 flex-1 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">事实 ID</label>
          <p id="detailId" class="text-sm font-mono text-slate-700">-</p>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">类别 / 类型</label>
          <p id="detailCategory" class="text-sm text-slate-700">-</p>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">描述</label>
          <p id="detailDescription" class="text-sm text-slate-800 bg-slate-50 p-3 rounded">-</p>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">代码位置</label>
          <p id="detailLocation" class="text-sm text-slate-600 font-mono">-</p>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">可信度</label>
          <p id="detailConfidence" class="text-sm">-</p>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">证据 / 来源</label>
          <p id="detailEvidence" class="text-sm text-slate-600 bg-slate-50 p-3 rounded">-</p>
        </div>

        <hr class="border-slate-200">

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">审核结果</label>
          <div class="flex gap-2">
            <button id="markOkBtn" class="flex-1 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700 transition-colors">
              <i class="fa-solid fa-check mr-1"></i> 确认正确
            </button>
            <button id="markErrorBtn" class="flex-1 py-2 bg-red-600 text-white rounded text-sm hover:bg-red-700 transition-colors">
              <i class="fa-solid fa-xmark mr-1"></i> 标记错误
            </button>
          </div>
        </div>

        <div id="errorFields" class="hidden space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">错误类型</label>
            <select id="errorType" class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <option value="">请选择错误类型...</option>
              <option value="module_miscluster">模块划分错误</option>
              <option value="call_missing">调用链遗漏</option>
              <option value="call_wrong">调用链错误</option>
              <option value="state_false_positive">状态读写误报</option>
              <option value="state_false_negative">状态读写漏报</option>
              <option value="module_desc_wrong">模块职责描述错误</option>
              <option value="approach_wrong">实现思路推断错误</option>
              <option value="pattern_false_positive">设计模式误报</option>
              <option value="flow_missing">业务流程遗漏</option>
              <option value="flow_wrong">业务流程步骤错误</option>
              <option value="other">其他错误</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">备注说明</label>
            <textarea id="errorNotes" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="简要说明错误原因或修复建议..."></textarea>
          </div>
          <button id="saveErrorBtn" class="w-full py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 transition-colors">
            <i class="fa-solid fa-floppy-disk mr-1"></i> 保存错误标记
          </button>
        </div>

        <button id="resetBtn" class="w-full py-2 bg-slate-100 text-slate-600 rounded text-sm hover:bg-slate-200 transition-colors">
          <i class="fa-solid fa-rotate-left mr-1"></i> 重置审核状态
        </button>

        <div class="flex gap-2">
          <button id="prevBtn" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded text-sm hover:bg-slate-200 transition-colors">
            <i class="fa-solid fa-chevron-left mr-1"></i> 上一条
          </button>
          <button id="nextBtn" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded text-sm hover:bg-slate-200 transition-colors">
            下一条 <i class="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <!-- 报告弹窗 -->
  <div id="reportModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-white rounded-lg shadow-xl w-[600px] max-h-[80vh] overflow-y-auto">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white">
        <h3 class="font-semibold text-slate-800">审核报告</h3>
        <button id="closeReportBtn" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="reportContent" class="p-6">
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
